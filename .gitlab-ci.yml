stages:
  - build   # build everythin
  - test    # run tests
  - coverage # coverage files
  - deploy:docs  # deploy locally
  - deploy:aml:py3
  - deploy:aml:py2
  - deploy:gapps:py3
  - deploy:gapps:py2

# Raw scripts
# runner specific rules (cz/not cz) are set in niclude files

.install_kosh:
  script:
    - git clean -fdx
    - echo "Activating venv p3"
    - source /usr/workspace/${USER}/gitlab/gitlab_kosh_py3/bin/activate
    - echo "Cloning sina"
    - GIT_SSH_COMMAND='/usr/bin/ssh -v -i ~/.ssh/gitlab' /usr/tce/bin/git clone ssh://git@cz-bitbucket.llnl.gov:7999/sibo/sina.git
    - cd sina/python
    - echo "building sina"
    - pip install .
    - echo "Activating env py2"
    - source /usr/workspace/${USER}/gitlab/gitlab_kosh_py2/bin/activate
    - pip install .
    - cd ../..
    - cd ${CI_PROJECT_DIR}
    - echo "Activating env py3"
    - source /usr/workspace/${USER}/gitlab/gitlab_kosh_py3/bin/activate
    - echo `which python`
    - echo `which pip`
    - echo $USER
    - echo `id`
    - echo `pwd`
    - pip install .
    - echo "Activating env py2"
    - source /usr/workspace/${USER}/gitlab/gitlab_kosh_py2/bin/activate
    - pip install .

.run_tests:
  script:
    - echo "testing Py3"
    - echo "Activating env py3"
    - source /usr/workspace/${USER}/gitlab/gitlab_kosh_py3/bin/activate
    - echo "cleaning repo"
    - git clean -fdx
    - eval `ssh-agent`
    - ssh-add ${HOME}/.ssh/gitlab
    - env DISPLAY=:0. pytest -s --cov=kosh tests/non_parallel/test_kosh_*.py
    - env DISPLAY=:0. pytest --cov=kosh --cov-append -n 16 tests/test_kosh_*.py
    - echo "Activating env py2"
    - source /usr/workspace/${USER}/gitlab/gitlab_kosh_py2/bin/activate
    - env DISPLAY=:0. pytest -n 16 tests/test_kosh_*.py
    - env DISPLAY=:0. pytest -s tests/non_parallel/test_kosh_*.py
#this file will store file characteristics that the 
#pipeline needs to check
  artifacts:
    paths:
      - .coverage
    expire_in: 3 hours

.gen_coverage:
  script:
    - echo "Activating env py3"
    - source /usr/workspace/${USER}/gitlab/gitlab_kosh_py3/bin/activate
    - echo "Producing coverage files"
    - coverage html --omit doutriaux1
  artifacts:
    paths:
      - .coverage
      - htmlcov
    expire_in: 3 hours

.deploy_to_:
  script:
    - if [ "${CI_COMMIT_BRANCH}" != "develop" ] ; then exit 0; fi
    - |
      xsu aml -E -L -c "/bin/bash -l" <<AS_AML_USER
        set -e
        set -x
        sg ${DEPLOY_USER}
        cd
        pwd
        cd git/sina
        GIT_SSH_COMMAND='/usr/bin/ssh -i ~/.ssh/gitlab' git reset --hard origin/develop
        GIT_SSH_COMMAND='/usr/bin/ssh -i ~/.ssh/gitlab' git pull
        cd python
        ${DEPLOY_PATH}/${DEPLOY_ENV}/bin/pip install .
        cd ../../kosh
        git fetch
        git checkout ${CI_COMMIT_SHA}
        ${DEPLOY_PATH}/${DEPLOY_ENV}/bin/pip install .
        find ${DEPLOY_PATH}/${DEPLOY_ENV}/bin -type f -exec chmod g+rx  {} +
        find ${DEPLOY_PATH}/${DEPLOY_ENV} -type f -exec chmod g+r  {} +
        find ${DEPLOY_PATH}/${DEPLOY_ENV} -type d -exec chmod g+rx  {} +
      AS_AML_USER

.deploy_to_py3:
  variables:
    DEPLOY_ENV: "dev"

.deploy_to_py2:
  variables:
    DEPLOY_ENV: "dev.py2"

.deploy_to_aml:
  variables:
    DEPLOY_PATH: "/usr/workspace/aml_cs/kosh/toss_3_x86_64_ib"
    DEPLOY_USER: "aml_cs"

.deploy_to_gapps:
  variables:
    DEPLOY_PATH: "/usr/apps/kosh"
    DEPLOY_USER: "kosh_usr"

.deploy_docs:
  script:
    - if [ "${CI_COMMIT_BRANCH}" != "develop" ] ; then exit 0; fi
    - echo "Activating docs env"
    - source /usr/workspace/${USER}/gitlab/docs/bin/activate
    - cd docs
    - env PATH=$PATH:$HOME/.local/bin make html
    - cp -rf build/html/* /usr/global/web-pages/lc/www/kosh

# CI on CZ
.on_cz:
  tags:
    - shell
    - surface
  only:
    variables:
      - $SOURCE_ZONE == "CZ"

install_on_cz:
  stage: build
  extends: [ .on_cz , .install_kosh ]

test_on_cz:
  stage: test
  extends: [ .on_cz , .run_tests ]

gen_coverage_on_cz:
  stage: coverage
  extends: [ .on_cz ,  .gen_coverage ]

deploy_to_aml_on_cz_py3:
  stage: deploy:aml:py3
  extends: [ .on_cz , .deploy_to_py3, .deploy_to_aml, .deploy_to_ ]

deploy_to_aml_on_cz_py2:
  stage: deploy:aml:py2
  extends: [ .on_cz , .deploy_to_py2, .deploy_to_aml, .deploy_to_ ]

deploy_doc_on_cz:
  stage: deploy:docs
  only:
    - stable
  extends: [ .on_cz, .deploy_docs ]

